<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="cyh测试">
    <title>cyh测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            font-weight: 400;
        }
        
        .input-box {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease 0.1s both;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group:last-of-type {
            margin-bottom: 0;
        }
        
        .label {
            font-size: 13px;
            color: #636366;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input {
            width: 100%;
            height: 50px;
            font-size: 18px;
            color: #1c1c1e;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 0 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }
        
        input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: #007aff;
        }
        
        input::placeholder {
            color: #c7c7cc;
            font-weight: 400;
        }
        
        button {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, #007aff 0%, #0051d5 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
            transition: all 0.2s;
            animation: fadeInUp 0.6s ease 0.2s both;
        }
        
        button:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-reset {
            background: rgba(255, 255, 255, 0.9) !important;
            color: #ff375f !important;
            margin-top: 12px !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1) !important;
        }
        
        .btn-reset:active {
            background: rgba(255, 255, 255, 0.7) !important;
        }
        
        .answers {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.5s ease;
            display: none;
        }
        
        .answers.show {
            display: block;
        }
        
        .answer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .answer-title {
            font-size: 18px;
            font-weight: 700;
            color: #1c1c1e;
        }
        
        .answer-count {
            font-size: 14px;
            color: #636366;
            background: rgba(0, 0, 0, 0.05);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .answer-list {
            display: flex;
            flex-wrap: wrap;
        }
        
        .answer-item {
            font-size: 17px;
            color: #1c1c1e;
            font-weight: 500;
            width: 20%;
            padding: 10px 0;
            text-align: left;
            font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #007aff;
            font-size: 16px;
        }
        
        .loading.show {
            display: block;
        }
        
        .error {
            display: none;
            text-align: center;
            padding: 15px;
            color: #ff375f;
            font-size: 14px;
            background: rgba(255, 55, 95, 0.1);
            border-radius: 12px;
            margin-top: 10px;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🏭 智能工厂考试助手</div>
            <div class="subtitle">快速获取考试答案</div>
        </div>

        <div class="input-box">
            <div class="input-group">
                <label class="label">考试记录 ID</label>
                <input type="text" id="recordId" placeholder="请输入考试ID">
            </div>
            
            <div class="input-group">
                <label class="label">Cookie</label>
                <input type="text" id="cookie" placeholder="请输入Cookie" maxlength="2000">
            </div>
            
            <button id="fetchBtn" onclick="fetchAnswers()">获取答案</button>
            <button id="resetBtn" class="btn-reset" onclick="resetForm()" style="display:none;">重置</button>
        </div>
        
        <div class="loading" id="loading">加载中...</div>
        <div class="error" id="error"></div>
        
        <div class="answers" id="answers">
            <div class="answer-header">
                <span class="answer-title">答案列表</span>
                <span class="answer-count" id="answerCount"></span>
            </div>
            <div class="answer-list" id="answerList"></div>
        </div>
    </div>

    <script>
        // 使用 CORS 代理
        const PROXY_URLS = [
            'https://api.allorigins.win/get?url=',
            'https://corsproxy.io/?',
            'https://api.codetabs.com/v1/proxy?quest='
        ];

        async function fetchWithProxy(url, cookie) {
            for (let proxy of PROXY_URLS) {
                try {
                    const proxyUrl = proxy + encodeURIComponent(url);
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: {
                            'Cookie': cookie
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // allorigins 返回的数据在 contents 字段
                        if (data.contents) {
                            return JSON.parse(data.contents);
                        }
                        return data;
                    }
                } catch (e) {
                    console.log('Proxy failed:', proxy, e);
                    continue;
                }
            }
            throw new Error('所有代理都失败了');
        }

        async function fetchAnswers() {
            const recordId = document.getElementById('recordId').value.trim();
            const cookie = document.getElementById('cookie').value.trim();
            
            if (!recordId || !cookie) {
                showError('请填写完整信息');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const fetchBtn = document.getElementById('fetchBtn');
            
            loading.classList.add('show');
            error.classList.remove('show');
            fetchBtn.disabled = true;
            
            try {
                const url = `http://119.36.147.45:8041/msService/SESWssET/ExamRecord/ExamRecord/getExamRecordListById?id=${recordId}`;
                const data = await fetchWithProxy(url, cookie);
                parseData(data);
            } catch (err) {
                showError('请求失败: ' + err.message);
            } finally {
                loading.classList.remove('show');
                fetchBtn.disabled = false;
            }
        }

        function parseData(data) {
            const list = [];
            
            if (data.data && data.data[0] && data.data[0].examQuestionVOList) {
                data.data[0].examQuestionVOList.forEach((q, i) => {
                    let ans = '';
                    
                    if (q.subjectType && q.subjectType.code === 'judge') {
                        ans = q.proper ? '对' : '错';
                    } else if (q.examAnswerVOList) {
                        const correctIndices = [];
                        q.examAnswerVOList.forEach((a, idx) => {
                            if (a.correct || a.isCorrect) {
                                correctIndices.push(['A','B','C','D','E','F'][idx]);
                            }
                        });
                        ans = correctIndices.join('') || '?';
                    }
                    list.push({ num: i + 1, ans: ans });
                });
            }

            if (list.length > 0) {
                displayAnswers(list);
            } else {
                showError('未找到答案');
            }
        }

        function displayAnswers(answers) {
            const answersDiv = document.getElementById('answers');
            const answerList = document.getElementById('answerList');
            const answerCount = document.getElementById('answerCount');
            const resetBtn = document.getElementById('resetBtn');
            
            answerCount.textContent = `共 ${answers.length} 题`;
            
            answerList.innerHTML = answers.map(item => 
                `<div class="answer-item">${item.num}.${item.ans}</div>`
            ).join('');
            
            answersDiv.classList.add('show');
            resetBtn.style.display = 'block';
        }

        function resetForm() {
            document.getElementById('recordId').value = '';
            document.getElementById('cookie').value = '';
            document.getElementById('answers').classList.remove('show');
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('error').classList.remove('show');
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.classList.add('show');
        }

        // 回车提交
        document.getElementById('cookie').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchAnswers();
            }
        });
    </script>
</body>
</html>
